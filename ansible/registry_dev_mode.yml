- hosts: 127.0.0.1
  connection: local
  vars:
    name: "megapolos"
    compose_file: /opt/megapolos_swarm_compose.yml
    data: "{{ lookup('file',lookup('ansible.builtin.env', 'JSON_PATH')) }}"
  tasks:
  - name: init
    import_tasks: init_include.yml
  - name: registry directory data
    ansible.builtin.file:
      path: /data/registry/data
      state: directory
  - name: registry directory auth
    ansible.builtin.file:
      path: /data/registry/auth
      state: directory
  - name: Copy nginx conf
    template:
      src: nginx.registry.template
      dest: /data/nginx/conf/registry.conf
  - name: Copy docker compose
    template:
      src: registry.compose.template
      dest: /data/registry/docker-compose.yml
  - name: registry password
    shell: |
      docker run --entrypoint htpasswd httpd:2 -Bbn '{{ data.registry_user }}' '{{ data.registry_password }}' > /data/registry/auth/htpasswd
  - ansible.builtin.pip:
      name:
        - docker
        - "urllib3<2"
        - "requests<2.32"
      state: present
      # --ignore-installed: не удалять системный (debian) urllib3 2.x (нет RECORD)
      extra_args: --break-system-packages --ignore-installed
  - name: docker compose
    community.docker.docker_compose_v2:
      project_src: /data/registry
  - name: Generate registry private key
    community.crypto.openssl_privatekey:
      path: /data/nginx/ssl/{{ data.registry_domain }}.key
      size: 2048
  - name: Generate registry CSR
    community.crypto.openssl_csr:
      path: /data/nginx/ssl/{{ data.registry_domain }}.csr
      privatekey_path: /data/nginx/ssl/{{ data.registry_domain }}.key
      common_name: "{{ data.registry_domain }}"
      subject_alt_name:
        - "DNS:{{ data.registry_domain }}"
        - "IP:127.0.0.1"
  - name: Sign registry certificate with Root CA
    community.crypto.x509_certificate:
      path: /data/nginx/ssl/{{ data.registry_domain }}.crt
      csr_path: /data/nginx/ssl/{{ data.registry_domain }}.csr
      provider: ownca
      ownca_path: /data/nginx/ssl/ca/ca.crt
      ownca_privatekey_path: /data/nginx/ssl/ca/ca.key
      ownca_not_after: "+825d"
  - name: ensure nginx is running
    docker_container:
      name: nginx
      state: started
  - name: reload nginx
    community.docker.docker_container_exec:
      container: nginx
      command: nginx -s reload
