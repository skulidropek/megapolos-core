- name: swarm directory
  ansible.builtin.file:
    path: /opt/megapolos_swarm_compose
    state: directory
- name: nginx directory
  ansible.builtin.file:
    path: /data/nginx/conf
    state: directory
- name: Install pip
  ansible.builtin.apt:
    name: pip
    state: present
- name: Install packages
  ansible.builtin.pip:
    name:
      - jsondiff
      - docker
      - passlib
      - "urllib3<2"
      - "requests<2.32"
      - ansible
      - cryptography
    # --ignore-installed: не пытаться удалять системные (debian) пакеты вроде
    # urllib3 2.x — у них нет RECORD-файла, pip падает "Cannot uninstall".
    # Ставим нужные версии в /usr/local (раньше в sys.path) поверх системных.
    extra_args: --break-system-packages --ignore-installed
- name: Install collection community.docker
  community.general.ansible_galaxy_install:
    type: collection
    name: community.docker

# ===== PROD (devMode=false): Let's Encrypt / certbot =====
- name: certbot cron
  ansible.builtin.cron:
    name: "certbot cron"
    minute: "0"
    hour: "3"
    job: "certbot renew --quiet --pre-hook \"docker stop nginx\" --post-hook \"docker start nginx\""
  when: not (data.dev_mode | default(false))

# ===== DEV (devMode=true): единый Megapolos Root CA (приходит от ядра) =====
- name: ssl directory
  ansible.builtin.file:
    path: /data/nginx/ssl/ca
    state: directory
  when: data.dev_mode | default(false)
- name: Write Megapolos Root CA certificate (from core)
  ansible.builtin.copy:
    content: "{{ data.ca_crt }}"
    dest: /data/nginx/ssl/ca/ca.crt
  when: data.dev_mode | default(false)
- name: Write Megapolos Root CA private key (from core)
  ansible.builtin.copy:
    content: "{{ data.ca_key }}"
    dest: /data/nginx/ssl/ca/ca.key
    mode: "0600"
  when: data.dev_mode | default(false)
- name: Generate node private key
  community.crypto.openssl_privatekey:
    path: /data/nginx/ssl/{{ data.node.host }}.key
    size: 2048
  when: data.dev_mode | default(false)
- name: Generate node CSR
  community.crypto.openssl_csr:
    path: /data/nginx/ssl/{{ data.node.host }}.csr
    privatekey_path: /data/nginx/ssl/{{ data.node.host }}.key
    common_name: "{{ data.node.host }}"
    subject_alt_name:
      - "DNS:{{ data.node.host }}"
      - "DNS:localhost"
      - "IP:127.0.0.1"
  when: data.dev_mode | default(false)
- name: Sign node certificate with Megapolos Root CA
  community.crypto.x509_certificate:
    path: /data/nginx/ssl/{{ data.node.host }}.crt
    csr_path: /data/nginx/ssl/{{ data.node.host }}.csr
    provider: ownca
    ownca_path: /data/nginx/ssl/ca/ca.crt
    ownca_privatekey_path: /data/nginx/ssl/ca/ca.key
    ownca_not_after: "+825d"
  when: data.dev_mode | default(false)

# ===== nginx (общий шаг сноса, затем dev/prod контейнер) =====
- name: remove old nginx if misconfigured
  community.docker.docker_container:
    name: nginx
    state: absent
    force_kill: yes
  ignore_errors: yes

# DEV: host network + самоподписанные серты из /data/nginx/ssl
- name: nginx (dev)
  community.docker.docker_container:
    name: nginx
    image: nginx
    user: root
    state: started
    restart_policy: always
    network_mode: host
    volumes:
      - /data/nginx/ssl:/etc/nginx/ssl
      - /data/nginx/conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
  when: data.dev_mode | default(false)

# PROD: bridge + порты + Let's Encrypt (как в оригинале)
- name: Copy nginx conf file
  template:
    src: nginx.conf.template
    dest: /data/nginx/nginx.conf
  when: not (data.dev_mode | default(false))
- name: nginx (prod)
  community.docker.docker_container:
    name: nginx
    image: nginx
    restart: yes
    ports:
      - "80:80"
      - "443:443"
      - "5102:5102"
      - "5104:5104"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /data/nginx/conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/nginx/nginx.conf:/etc/nginx/nginx.conf
  when: not (data.dev_mode | default(false))

- name: docker access
  community.docker.docker_container_exec:
    container: nginx
    command: "chmod -v 0777 /var/run/docker.sock"
- name: docker password
  # через docker (httpd:2), а НЕ community.general.htpasswd — тот требует python-passlib,
  # которого может не быть в интерпретаторе, выбранном ansible (напр. python3.14)
  shell: >
    docker run --rm --entrypoint htpasswd httpd:2 -Bbn
    'megapolos' '{{ data.node.password }}' > /data/nginx/conf/docker.htpasswd

# PROD: certbot для хоста ноды
- name: certificate
  shell: |
    certbot certonly  --pre-hook "docker stop nginx || true" --post-hook "docker start nginx || true" --standalone --noninteractive --agree-tos --cert-name {{ data.node.host }} -d {{ data.node.host }} --register-unsafely-without-email
  args:
    creates: /etc/letsencrypt/live/{{ data.node.host }}/fullchain.pem
  when: not (data.dev_mode | default(false))

- name: Copy docker nginx conf
  template:
    src: "{{ 'nginx.docker.template' if (data.dev_mode | default(false)) else 'nginx.docker.prod.template' }}"
    dest: /data/nginx/conf/docker.conf
- name: ensure a nginx is running
  docker_container:
    name: nginx
    state: started
- name: reload nginx
  # best-effort: на Docker Desktop/WSL exec в host-network контейнер убивается (rc 137) —
  # фолбэк на restart надёжно перечитывает конфиг; failed_when:false не валит play
  shell: docker exec nginx nginx -s reload || docker restart nginx
  failed_when: false
