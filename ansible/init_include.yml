- name: swarm directory
  ansible.builtin.file:
    path: /opt/megapolos_swarm_compose
    state: directory
- name: nginx directory
  ansible.builtin.file:
    path: /data/nginx/conf
    state: directory
- name: ssl directory
  ansible.builtin.file:
    path: /data/nginx/ssl/ca
    state: directory
- name: Install pip
  ansible.builtin.apt:
    name: pip
    state: present
- name: Install packages
  ansible.builtin.pip:
    name:
      - jsondiff
      - docker
      - passlib
      - urllib3
      - ansible
      - cryptography
- name: Install collection community.docker
  community.general.ansible_galaxy_install:
    type: collection
    name: community.docker
- name: Generate Root CA private key
  community.crypto.openssl_privatekey:
    path: /data/nginx/ssl/ca/ca.key
    size: 4096
- name: Generate Root CA certificate
  community.crypto.x509_certificate:
    path: /data/nginx/ssl/ca/ca.crt
    privatekey_path: /data/nginx/ssl/ca/ca.key
    provider: selfsigned
    selfsigned_not_after: "+3650d"
    subject:
      commonName: "Megapolos Root CA"
      organizationName: "Megapolos"
- name: Generate node private key
  community.crypto.openssl_privatekey:
    path: /data/nginx/ssl/{{ data.node.host }}.key
    size: 2048
- name: Generate node CSR
  community.crypto.openssl_csr:
    path: /data/nginx/ssl/{{ data.node.host }}.csr
    privatekey_path: /data/nginx/ssl/{{ data.node.host }}.key
    common_name: "{{ data.node.host }}"
    subject_alt_name:
      - "DNS:{{ data.node.host }}"
      - "DNS:localhost"
      - "IP:127.0.0.1"
- name: Sign node certificate with Root CA
  community.crypto.x509_certificate:
    path: /data/nginx/ssl/{{ data.node.host }}.crt
    csr_path: /data/nginx/ssl/{{ data.node.host }}.csr
    provider: ownca
    ownca_path: /data/nginx/ssl/ca/ca.crt
    ownca_privatekey_path: /data/nginx/ssl/ca/ca.key
    ownca_not_after: "+825d"
- name: Copy nginx conf file
  template:
    src: nginx.conf.template
    dest: /data/nginx/nginx.conf
- name: nginx
  community.docker.docker_container:
    name: nginx
    image: nginx
    restart: yes
    ports:
      - "80:80"
      - "443:443"
      - "5102:5102"
      - "5104:5104"
    volumes:
      - /data/nginx/ssl:/etc/nginx/ssl
      - /data/nginx/conf:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/nginx/nginx.conf:/etc/nginx/nginx.conf
- name: docker access
  community.docker.docker_container_exec:
    container: nginx
    command: "chmod -v 0777 /var/run/docker.sock"
- name: docker password
  community.general.htpasswd:
    path: /data/nginx/conf/docker.htpasswd
    name: megapolos
    password: "{{ data.node.password }}"
- name: Copy docker nginx conf
  template:
    src: nginx.docker.template
    dest: /data/nginx/conf/docker.conf
- name: ensure a nginx is running
  docker_container:
    name: nginx
    state: started
- name: reload nginx
  community.docker.docker_container_exec:
    container: nginx
    command: nginx -s reload
