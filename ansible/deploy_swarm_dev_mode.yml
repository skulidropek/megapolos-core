- hosts: 127.0.0.1
  connection: local
  no_log: "{{ lookup('ansible.builtin.env', 'MEGAPOLOS_DEBUG') == '0' }}"
  vars:
    name: "megapolos"
    compose_file: /opt/megapolos_swarm_compose.yml
    data: "{{ lookup('file',lookup('ansible.builtin.env', 'JSON_PATH')) | from_json }}"
  tasks:
  - name: volume directories
    ansible.builtin.file:
      path: "{{ item }}"
      state: directory
    with_items: "{{ data.volumes }}"
  - name: Copy stack file
    template:
        src: swarm_compose.yml
        dest: "{{ compose_file }}"
        mode: 0444
    register: stack_file
    tags: stack
  - name: start swarm
    community.docker.docker_swarm:
      state: present
      # advertise_addr нужен в WSL/multi-IP, иначе swarm init не выберет адрес
      advertise_addr: "{{ ansible_default_ipv4.address | default(omit) }}"
  - name: Deploy stack
    docker_stack:
        state: present
        name: "{{ name }}"
        prune: yes
        with_registry_auth: yes
        compose:
        - "{{ compose_file }}"
  # ===== self-signed серты доменов приложений (через единый Megapolos Root CA) =====
  - name: Generate domain private key
    community.crypto.openssl_privatekey:
      path: /data/nginx/ssl/{{ item.domain_name }}.key
      size: 2048
    with_items: "{{ data.containers }}"
    when: item.domain_name != None
  - name: Generate domain CSR
    community.crypto.openssl_csr:
      path: /data/nginx/ssl/{{ item.domain_name }}.csr
      privatekey_path: /data/nginx/ssl/{{ item.domain_name }}.key
      common_name: "{{ item.domain_name }}"
      subject_alt_name:
        - "DNS:{{ item.domain_name }}"
    with_items: "{{ data.containers }}"
    when: item.domain_name != None
  - name: Sign domain certificate with Megapolos Root CA
    community.crypto.x509_certificate:
      path: /data/nginx/ssl/{{ item.domain_name }}.crt
      csr_path: /data/nginx/ssl/{{ item.domain_name }}.csr
      provider: ownca
      ownca_path: /data/nginx/ssl/ca/ca.crt
      ownca_privatekey_path: /data/nginx/ssl/ca/ca.key
      ownca_not_after: "+825d"
    with_items: "{{ data.containers }}"
    when: item.domain_name != None
  - name: remove conf
    shell: |
      rm -f /data/nginx/conf/*.vhost.conf
  - name: Copy nginx virtualhosts conf
    template:
      src: nginx.vhost.template
      dest: /data/nginx/conf/{{ item.domain_name }}.vhost.conf
    with_items: "{{ data.containers }}"
    when: item.domain_name != None
  - name: domain password
    # docker-htpasswd вместо community.general.htpasswd (не зависит от python-passlib)
    shell: >
      docker run --rm --entrypoint htpasswd httpd:2 -Bbn
      '{{ item.auth_user }}' '{{ item.auth_password }}'
      > /data/nginx/conf/{{ item.domain_name }}.htpasswd
    with_items: "{{ data.containers }}"
    when: item.auth_user is defined
  - name: ensure a nginx is running
    docker_container:
      name: nginx
      state: started
  - name: reload nginx
    # best-effort: на Docker Desktop и WSL exec в host-network контейнер убивается (rc 137);
    # фолбэк на restart надёжно перечитывает конфиг; failed_when:false не валит play
    shell: docker exec nginx nginx -s reload || docker restart nginx
    failed_when: false
