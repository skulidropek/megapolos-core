- hosts: 127.0.0.1
  connection: local
  vars:
    name: "megapolos"
    compose_file: /opt/megapolos_swarm_compose.yml
    data: "{{ lookup('file',lookup('ansible.builtin.env', 'JSON_PATH')) | from_json }}"
  gather_facts: yes
  become: yes
  tasks:
  - name: init
    import_tasks: init_include.yml
  - name: Copy core nginx conf
    template:
      src: nginx.core.template
      dest: /data/nginx/conf/core.conf
  - name: ensure nginx is running
    docker_container:
      name: nginx
      state: started
  - name: reload nginx
    # best-effort: на Docker Desktop и WSL exec в host-network контейнер убивается (rc 137);
    # фолбэк на restart надёжно перечитывает конфиг; failed_when:false не валит play
    shell: docker exec nginx nginx -s reload || docker restart nginx
    failed_when: false
